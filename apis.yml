description: >-
  TravelClick, now Amadeus Hospitality, is a hotel commerce and distribution
  technology provider whose flagship product is the iHotelier Booking Engine 4.0
  (CRS/central reservation system). For developers it publishes the Amadeus
  iHotelier BE API — a family of OAuth 2.0 secured REST APIs that let web and B2C
  guest-facing applications search availability, hold and create reservations,
  manage group bookings, and drive the hotel booking flow. TravelClick also
  operates OTA Connect, a distribution API that connects channel-management
  partners and OTAs to hotel inventory. API documentation and interactive testing
  are available to accounts registered on the developer portal at
  developer.travelclick.com; non-production API keys are issued on request.
