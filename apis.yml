apis:
- name: Amadeus iHotelier BE API
  description: >-
    Family of OAuth 2.0 secured REST APIs for the iHotelier Booking Engine 4.0
    (CRS). Enables B2C / web-client applications to search availability, hold and
    create reservations (including group reservations), and build guest-facing
    hotel booking experiences. Endpoints follow a /book/v1/hotel/{hotelCode}/...
    URI pattern (e.g. POST /book/v1/hotel/{hotelCode}/reservation). Documentation
    and interactive testing require developer-portal registration.
